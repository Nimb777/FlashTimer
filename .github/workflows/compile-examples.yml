name: Compile examples

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          # Download and extract the latest Linux x86_64 arduino-cli binary
          curl -fsSL -o /tmp/arduino-cli.tar.gz https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin --strip-components=1
          arduino-cli version || true

      - name: Update core index
        run: arduino-cli core update-index

      - name: Install esp8266 core
        run: arduino-cli core install esp8266:esp8266

      - name: Install esp32 core
        run: arduino-cli core install esp32:esp32

      - name: Prepare examples for Arduino CLI
        run: |
          mkdir -p FlashTimer/examples/NodeMCUExample
          mkdir -p FlashTimer/examples/FlashTimer
          cp -f FlashTimer/examples/NodeMCUExample.ino FlashTimer/examples/NodeMCUExample/NodeMCUExample.ino
          cp -f FlashTimer/examples/FlashTimer.ino FlashTimer/examples/FlashTimer/FlashTimer.ino

      - name: Install local library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp -R FlashTimer "$HOME/Arduino/libraries/FlashTimer"

      - name: Compile FlashTimer example for NodeMCU (esp8266)
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 FlashTimer/examples/NodeMCUExample

      - name: Compile FlashTimer example for ESP32
        run: arduino-cli compile --fqbn esp32:esp32:esp32 FlashTimer/examples/FlashTimer
